<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة تحكم | نار & توابل</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Tajawal', sans-serif; background-color: #0f172a; color: #f8fafc; }
    .glass-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.05); }
    .glass-card { background: linear-gradient(145deg, rgba(30, 41, 59, 0.9), rgba(15, 23, 42, 0.9)); border: 1px solid rgba(255, 255, 255, 0.05); box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1); }
    
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #ea580c; border-radius: 4px; }
    
    .nav-active { background-color: #ea580c; color: white; font-weight: bold; }
    .nav-inactive { background-color: transparent; color: #94a3b8; }
    .nav-inactive:hover { background-color: #1e293b; color: white; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center">

  <!-- ================= شاشة تسجيل الدخول ================= -->
  <div id="loginScreen" class="glass-panel p-10 rounded-3xl w-full max-w-md text-center shadow-2xl">
    <div class="text-6xl mb-6 drop-shadow-lg">🔥</div>
    <h2 class="text-3xl font-black mb-8 text-transparent bg-clip-text bg-gradient-to-r from-orange-400 to-red-500">نار & توابل</h2>
    <input type="email" id="email" placeholder="البريد الإلكتروني" class="w-full mb-4 p-4 rounded-xl bg-slate-800 border border-slate-700 text-white focus:outline-none focus:border-orange-500">
    <input type="password" id="password" placeholder="كلمة المرور" class="w-full mb-8 p-4 rounded-xl bg-slate-800 border border-slate-700 text-white focus:outline-none focus:border-orange-500">
    <button onclick="login()" class="w-full bg-gradient-to-r from-orange-500 to-red-600 hover:from-orange-600 hover:to-red-700 text-white font-bold py-4 px-4 rounded-xl shadow-lg transition duration-200">
      تسجيل الدخول للإدارة
    </button>
    <p id="errorMsg" class="text-red-400 mt-4 text-sm hidden"></p>
  </div>

  <!-- ================= لوحة التحكم ================= -->
  <div id="dashboardScreen" class="hidden w-full min-h-screen flex-col md:flex-row">
    
    <!-- القائمة الجانبية -->
    <aside class="w-full md:w-72 glass-panel flex flex-col border-l border-slate-800">
      <div class="p-8 flex items-center gap-4 border-b border-slate-800">
        <div class="text-4xl">🔥</div>
        <div>
          <h1 class="text-2xl font-black text-white">Nar & Spice</h1>
          <p class="text-xs text-slate-400">الإدارة المركزية</p>
        </div>
      </div>
      <nav class="flex-1 px-4 py-6 space-y-3">
        <button onclick="switchTab('overview')" id="nav-overview" class="w-full text-right p-4 rounded-xl nav-active transition flex items-center gap-3">
          📊 <span>نظرة عامة</span>
        </button>
        <button onclick="switchTab('orders')" id="nav-orders" class="w-full text-right p-4 rounded-xl nav-inactive transition flex items-center gap-3">
          🛒 <span>إدارة الطلبات</span>
        </button>
        <button onclick="switchTab('menu')" id="nav-menu" class="w-full text-right p-4 rounded-xl nav-inactive transition flex items-center gap-3">
          🍔 <span>إدارة المنيو</span>
        </button>
      </nav>
      <div class="p-4 border-t border-slate-800">
        <button onclick="logout()" class="w-full p-4 rounded-xl border border-red-500/50 text-red-400 hover:bg-red-500 hover:text-white transition flex items-center justify-center gap-2 font-bold">
          تسجيل الخروج 🚪
        </button>
      </div>
    </aside>

    <!-- المحتوى الرئيسي -->
    <main class="flex-1 p-6 md:p-10 h-screen overflow-y-auto relative">
      
      <!-- 1. قسم النظرة العامة -->
      <section id="sec-overview" class="block animate-fade-in">
        <h2 class="text-3xl font-bold mb-8 text-white">نظرة عامة على الأداء 📈</h2>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">
          <div class="glass-card p-6 rounded-2xl flex flex-col justify-between">
            <span class="text-slate-400 font-medium">إجمالي مبيعات اليوم</span>
            <div class="text-4xl font-black text-green-400 mt-2" id="stat-today-sales">0 ج.م</div>
          </div>
          <div class="glass-card p-6 rounded-2xl flex flex-col justify-between border-t-4 border-orange-500">
            <span class="text-slate-400 font-medium">طلبات جديدة (تحتاج متابعة)</span>
            <div class="text-4xl font-black text-orange-400 mt-2" id="stat-new-orders">0</div>
          </div>
          <div class="glass-card p-6 rounded-2xl flex flex-col justify-between">
            <span class="text-slate-400 font-medium">إجمالي طلبات الشهر</span>
            <div class="text-4xl font-black text-white mt-2" id="stat-month-orders">0</div>
          </div>
        </div>
      </section>

      <!-- 2. قسم إدارة الطلبات -->
      <section id="sec-orders" class="hidden animate-fade-in">
        <h2 class="text-3xl font-bold mb-6 text-white">إدارة الطلبات 🛒</h2>
        
        <!-- الفلاتر -->
        <div class="glass-card p-4 rounded-xl mb-6 flex flex-col md:flex-row gap-4">
          <input type="text" id="searchInput" oninput="renderOrders()" placeholder="بحث برقم الطلب، العميل، الهاتف..." class="flex-1 p-3 rounded-lg bg-slate-800 border border-slate-700 text-white focus:outline-none focus:border-orange-500">
          <select id="statusFilter" onchange="renderOrders()" class="p-3 rounded-lg bg-slate-800 border border-slate-700 text-white focus:outline-none focus:border-orange-500">
            <option value="all">كل الحالات</option>
            <option value="new">جديد</option>
            <option value="shipped">تم الشحن</option>
            <option value="delivered">تم التوصيل</option>
          </select>
          <input type="date" id="dateFilter" onchange="renderOrders()" class="p-3 rounded-lg bg-slate-800 border border-slate-700 text-white focus:outline-none focus:border-orange-500">
          <button onclick="clearFilters()" class="px-4 py-3 bg-slate-700 hover:bg-slate-600 rounded-lg text-white transition">إلغاء الفلاتر</button>
        </div>

        <!-- جدول الطلبات -->
        <div class="glass-panel rounded-2xl overflow-hidden overflow-x-auto shadow-xl">
          <table class="w-full text-right border-collapse">
            <thead>
              <tr class="bg-slate-800 text-slate-300 text-sm uppercase tracking-wider">
                <th class="p-5 font-medium">رقم الطلب</th>
                <th class="p-5 font-medium">العميل</th>
                <th class="p-5 font-medium">الإجمالي</th>
                <th class="p-5 font-medium">تاريخ الطلب</th>
                <th class="p-5 font-medium">الحالة</th>
                <th class="p-5 text-center font-medium">إجراءات</th>
              </tr>
            </thead>
            <tbody id="ordersTableBody" class="divide-y divide-slate-700/50">
              <!-- الطلبات هتظهر هنا -->
            </tbody>
          </table>
        </div>
      </section>

      <!-- 3. قسم إدارة المنيو -->
      <section id="sec-menu" class="hidden animate-fade-in">
        <div class="flex justify-between items-center mb-6">
          <h2 class="text-3xl font-bold text-white">إدارة المنيو 🍔</h2>
          <button onclick="toggleMenuForm()" class="bg-green-600 hover:bg-green-700 text-white px-6 py-3 rounded-xl font-bold transition flex items-center gap-2">
            + إضافة صنف جديد
          </button>
        </div>

        <!-- فورم الإضافة والتعديل -->
        <div id="menuFormSection" class="hidden glass-card p-6 rounded-2xl mb-8 border border-orange-500/30">
          <h3 class="text-xl font-bold mb-4 text-orange-400" id="menuFormTitle">إضافة صنف جديد</h3>
          <input type="hidden" id="menuItemId">
          
          <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-4">
            <input type="text" id="menuItemName" placeholder="اسم الصنف (مثال: برجر ناري)" class="p-3 rounded-lg bg-slate-800 border border-slate-700 text-white">
            <input type="number" id="menuItemPrice" placeholder="السعر" class="p-3 rounded-lg bg-slate-800 border border-slate-700 text-white">
            
            <select id="menuItemCategory" class="p-3 rounded-lg bg-slate-800 border border-slate-700 text-white">
              <option value="وجبات">وجبات</option>
              <option value="سندوتشات">سندوتشات</option>
              <option value="مشروبات">مشروبات</option>
              <option value="إضافات">إضافات</option>
            </select>

            <!-- القائمة الخاصة بتحديد متاح أو غير متاح -->
            <select id="menuItemStatus" class="p-3 rounded-lg bg-slate-800 border border-slate-700 text-white focus:border-orange-500">
              <option value="available">✅ متاح</option>
              <option value="out_of_stock">❌ غير متاح (نفاذ الكمية)</option>
            </select>
          </div>

          <div class="flex gap-2">
            <button onclick="saveMenuItem()" class="bg-orange-600 hover:bg-orange-700 text-white px-6 py-2 rounded-lg font-bold transition">حفظ التعديلات</button>
            <button onclick="toggleMenuForm()" class="bg-slate-600 hover:bg-slate-700 text-white px-6 py-2 rounded-lg transition">إلغاء</button>
          </div>
        </div>

        <!-- جدول المنيو -->
        <div class="glass-panel rounded-2xl overflow-hidden shadow-xl">
          <table class="w-full text-right border-collapse">
            <thead>
              <tr class="bg-slate-800 text-slate-300 text-sm">
                <th class="p-4 font-medium">اسم الصنف</th>
                <th class="p-4 font-medium">القسم</th>
                <th class="p-4 font-medium">السعر</th>
                <th class="p-4 font-medium">حالة التوفر</th>
                <th class="p-4 text-center font-medium">إجراءات</th>
              </tr>
            </thead>
            <tbody id="menuTableBody" class="divide-y divide-slate-700/50">
              <!-- المنيو هيظهر هنا -->
            </tbody>
          </table>
        </div>
      </section>

    </main>
  </div>

  <!-- سكربتات Firebase -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAD8XEkgwId6rYr9j-iengayu92MObOz44",
      authDomain: "nar-and-spice-db.firebaseapp.com",
      projectId: "nar-and-spice-db",
      storageBucket: "nar-and-spice-db.firebasestorage.app",
      messagingSenderId: "730387083482",
      appId: "1:730387083482:web:f19e20064ee188bc1775e3"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    window.allOrders = [];
    window.allMenuItems = []; 

    function switchTab(tabName) {
      document.querySelectorAll('section').forEach(sec => sec.classList.add('hidden'));
      document.getElementById('sec-' + tabName).classList.remove('hidden');
      document.querySelectorAll('aside nav button').forEach(btn => {
        btn.classList.remove('nav-active');
        btn.classList.add('nav-inactive');
      });
      document.getElementById('nav-' + tabName).classList.add('nav-active');
      document.getElementById('nav-' + tabName).classList.remove('nav-inactive');
    }

    auth.onAuthStateChanged(user => {
      if (user) {
        document.getElementById('loginScreen').classList.add('hidden');
        const dashboard = document.getElementById('dashboardScreen');
        dashboard.classList.remove('hidden');
        dashboard.classList.add('flex');
        fetchOrders();
        fetchMenu();
      } else {
        document.getElementById('loginScreen').classList.remove('hidden');
        const dashboard = document.getElementById('dashboardScreen');
        dashboard.classList.add('hidden');
        dashboard.classList.remove('flex');
      }
    });

    function login() {
      const email = document.getElementById('email').value;
      const pass = document.getElementById('password').value;
      auth.signInWithEmailAndPassword(email, pass).catch(error => {
        const errorMsg = document.getElementById('errorMsg');
        errorMsg.textContent = "خطأ في تسجيل الدخول. يرجى مراجعة البيانات.";
        errorMsg.classList.remove('hidden');
      });
    }

    function logout() { auth.signOut(); }

    function fetchOrders() {
      db.collection("orders").orderBy("timestamp", "desc").onSnapshot(snapshot => {
        window.allOrders = [];
        snapshot.forEach(doc => {
          window.allOrders.push({ id: doc.id, ...doc.data() });
        });
        renderOrders();
        updateDashboardStats();
      });
    }

    function renderOrders() {
      const tbody = document.getElementById('ordersTableBody');
      tbody.innerHTML = '';
      const searchTerm = document.getElementById('searchInput').value.toLowerCase();
      const statusFilter = document.getElementById('statusFilter').value;
      const dateFilter = document.getElementById('dateFilter').value;

      const filteredOrders = window.allOrders.filter(order => {
        const matchesSearch = 
          (order.orderNumber && order.orderNumber.toString().includes(searchTerm)) ||
          (order.customerName && order.customerName.toLowerCase().includes(searchTerm)) ||
          (order.customerPhone && order.customerPhone.includes(searchTerm));
        const matchesStatus = statusFilter === 'all' || order.status === statusFilter;
        let matchesDate = true;
        if (dateFilter && order.timestamp) {
          const orderDate = new Date(order.timestamp).toISOString().split('T')[0];
          matchesDate = (orderDate === dateFilter);
        }
        return matchesSearch && matchesStatus && matchesDate;
      });

      if (filteredOrders.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="p-8 text-center text-slate-400">لا توجد طلبات مطابقة.</td></tr>`;
        return;
      }

      filteredOrders.forEach(order => {
        let dateStr = order.timestamp ? new Date(order.timestamp).toLocaleString('ar-EG', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : "غير محدد";

        const tr = document.createElement('tr');
        tr.className = "hover:bg-slate-800/50 transition duration-150";
        
        // الأيقونات القديمة رجعت هنا 👇
        tr.innerHTML = `
          <td class="p-5 font-bold text-orange-400">#${order.orderNumber || order.id.substring(0,6)}</td>
          <td class="p-5">
            <div class="font-medium text-white">${order.customerName || 'بدون اسم'}</div>
            <div class="text-xs text-slate-400 font-mono" dir="ltr">${order.customerPhone || ''}</div>
          </td>
          <td class="p-5 font-black text-green-400">${order.total} EGP</td>
          <td class="p-5 text-slate-300 text-sm">${dateStr}</td>
          <td class="p-5">
            <select onchange="updateStatus('${order.id}', this.value)" class="bg-slate-900 border border-slate-700 text-white text-sm rounded-lg focus:ring-orange-500 block p-2">
              <option value="new" ${order.status === 'new' ? 'selected' : ''}>🟠 جديد</option>
              <option value="shipped" ${order.status === 'shipped' ? 'selected' : ''}>🔵 تم الشحن</option>
              <option value="delivered" ${order.status === 'delivered' ? 'selected' : ''}>🟢 تم التوصيل</option>
            </select>
          </td>
          <td class="p-5 flex justify-center gap-2">
            <button onclick="viewDetails('${order.id}')" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-2 rounded-lg text-sm flex items-center justify-center" title="التفاصيل">
              📄
            </button>
            <button onclick="sendWhatsApp('${order.customerPhone}', '${order.customerName}', '${order.orderNumber}', '${order.status}')" class="bg-green-600 hover:bg-green-700 text-white px-3 py-2 rounded-lg text-sm flex items-center justify-center" title="مراسلة واتساب">
              <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12.012 2C6.466 2 1.96 6.486 1.956 12.015c0 1.767.458 3.492 1.332 5.012L2 22l5.127-1.337c1.464.799 3.125 1.22 4.88 1.22h.004c5.546 0 10.052-4.486 10.056-10.015A9.97 9.97 0 0019.124 4.93a9.92 9.92 0 00-7.112-2.93zm0 18.232h-.004a8.318 8.318 0 01-4.24-1.162l-.304-.18-3.155.827.842-3.076-.198-.315a8.27 8.27 0 01-1.272-4.43c.003-4.595 3.74-8.332 8.337-8.332 2.226 0 4.316.868 5.888 2.443a8.27 8.27 0 012.44 5.891c-.003 4.594-3.74 8.334-8.334 8.334zm4.568-6.225c-.25-.125-1.482-.732-1.712-.816-.23-.083-.398-.125-.565.125-.167.25-.648.816-.795.983-.146.167-.294.187-.544.062-.25-.125-1.058-.39-2.015-1.242-.745-.663-1.247-1.483-1.394-1.733-.146-.25-.015-.385.11-.51.112-.113.25-.292.375-.438.125-.146.167-.25.25-.417.083-.167.042-.313-.02-.438-.063-.125-.566-1.355-.776-1.855-.205-.487-.413-.42-.566-.428l-.483-.008c-.167 0-.44.062-.67.313-.23.25-.877.855-.877 2.085s.898 2.418 1.023 2.585c.125.167 1.765 2.693 4.276 3.778.598.258 1.065.412 1.43.528.6.19 1.144.163 1.572.099.482-.072 1.482-.605 1.692-1.19.21-.585.21-1.085.147-1.19-.063-.105-.23-.167-.48-.292z"/></svg>
            </button>
            <button onclick="deleteOrder('${order.id}')" class="bg-red-600 hover:bg-red-700 text-white px-3 py-2 rounded-lg text-sm flex items-center justify-center" title="حذف الطلب">
              🗑️
            </button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    function clearFilters() {
      document.getElementById('searchInput').value = '';
      document.getElementById('statusFilter').value = 'all';
      document.getElementById('dateFilter').value = '';
      renderOrders();
    }

    function updateDashboardStats() {
      const today = new Date().toISOString().split('T')[0];
      let todaySales = 0, newOrdersCount = 0, monthOrdersCount = 0;
      window.allOrders.forEach(order => {
        if (order.status === 'new') newOrdersCount++;
        monthOrdersCount++;
        if (order.timestamp) {
          const orderDate = new Date(order.timestamp).toISOString().split('T')[0];
          if (orderDate === today) todaySales += Number(order.total) || 0;
        }
      });
      document.getElementById('stat-today-sales').textContent = todaySales + " ج.م";
      document.getElementById('stat-new-orders').textContent = newOrdersCount;
      document.getElementById('stat-month-orders').textContent = monthOrdersCount;
    }

    function updateStatus(docId, newStatus) { db.collection("orders").doc(docId).update({ status: newStatus }); }
    function deleteOrder(docId) { if (confirm("هل أنت متأكد من حذف الطلب نهائياً؟")) db.collection("orders").doc(docId).delete(); }
    function viewDetails(orderId) { 
      const order = window.allOrders.find(o => o.id === orderId); 
      alert(order && order.orderDetails ? order.orderDetails : "تفاصيل غير متوفرة."); 
    }
    function sendWhatsApp(phone, name, orderNum, status) {
      let formattedPhone = phone.startsWith('01') ? '+2' + phone : phone;
      let msg = `أهلاً بيك يا ${name}\nبخصوص طلبك رقم (${orderNum}) من نار & توابل.\n\n`;
      if (status === 'new') msg += "حالة الطلب: استلمنا طلبك وبنجهزه حالياً 🍳";
      else if (status === 'shipped') msg += "حالة الطلب: طلبك في الطريق ليك 🛵";
      else if (status === 'delivered') msg += "حالة الطلب: تم التوصيل، بالهنا والشفا! 🔥";
      window.open(`https://wa.me/${formattedPhone.replace('+', '')}?text=${encodeURIComponent(msg)}`, '_blank');
    }

    // ==========================================
    // إدارة المنيو وتحديث حالة التوفر (متاح/نفاذ الكمية)
    // ==========================================
    function fetchMenu() {
      db.collection("menu").onSnapshot(snapshot => {
        window.allMenuItems = [];
        const tbody = document.getElementById('menuTableBody');
        tbody.innerHTML = '';
        
        snapshot.forEach(doc => {
          const item = { id: doc.id, ...doc.data() };
          window.allMenuItems.push(item);
          
          // عرض حالة المنتج
          const statusHtml = item.status === 'out_of_stock' 
            ? `<span class="bg-red-900/50 text-red-400 px-3 py-1 rounded-full text-xs border border-red-800">❌ نفاذ الكمية</span>`
            : `<span class="bg-green-900/50 text-green-400 px-3 py-1 rounded-full text-xs border border-green-800">✅ متاح</span>`;

          const tr = document.createElement('tr');
          tr.className = "hover:bg-slate-800/50 transition";
          tr.innerHTML = `
            <td class="p-4 font-bold text-white">${item.name}</td>
            <td class="p-4 text-slate-300"><span class="bg-slate-800 px-3 py-1 rounded-full text-xs">${item.category}</span></td>
            <td class="p-4 font-black text-orange-400">${item.price} EGP</td>
            <td class="p-4">${statusHtml}</td>
            <td class="p-4 flex justify-center gap-2">
              <button onclick="editMenuItem('${item.id}')" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-lg text-sm">تعديل ✏️</button>
              <button onclick="deleteMenuItem('${item.id}')" class="bg-red-600 hover:bg-red-500 text-white px-4 py-2 rounded-lg text-sm">حذف 🗑️</button>
            </td>
          `;
          tbody.appendChild(tr);
        });
      });
    }

    function toggleMenuForm() {
      const form = document.getElementById('menuFormSection');
      if(form.classList.contains('hidden')){
        form.classList.remove('hidden');
        document.getElementById('menuFormTitle').textContent = "إضافة صنف جديد";
        document.getElementById('menuItemId').value = "";
        document.getElementById('menuItemName').value = "";
        document.getElementById('menuItemPrice').value = "";
        document.getElementById('menuItemStatus').value = "available";
      } else {
        form.classList.add('hidden');
      }
    }

    function saveMenuItem() {
      const id = document.getElementById('menuItemId').value;
      const name = document.getElementById('menuItemName').value;
      const price = document.getElementById('menuItemPrice').value;
      const category = document.getElementById('menuItemCategory').value;
      const status = document.getElementById('menuItemStatus').value; // جلب حالة المنتج

      if(!name || !price) return alert("يرجى إدخال اسم وسعر الصنف!");

      const itemData = { name, price: Number(price), category, status };

      if(id) {
        db.collection("menu").doc(id).update(itemData).then(() => toggleMenuForm());
      } else {
        db.collection("menu").add(itemData).then(() => toggleMenuForm());
      }
    }

    function editMenuItem(id) {
      const item = window.allMenuItems.find(i => i.id === id);
      if(item) {
        document.getElementById('menuFormSection').classList.remove('hidden');
        document.getElementById('menuFormTitle').textContent = "تعديل الصنف";
        document.getElementById('menuItemId').value = item.id;
        document.getElementById('menuItemName').value = item.name;
        document.getElementById('menuItemPrice').value = item.price;
        document.getElementById('menuItemCategory').value = item.category;
        document.getElementById('menuItemStatus').value = item.status || 'available';
      }
    }

    function deleteMenuItem(id) {
      if (confirm("هل تريد بالتأكيد حذف هذا الصنف من المنيو؟")) {
        db.collection("menu").doc(id).delete();
      }
    }
  </script>
</body>
</html>
